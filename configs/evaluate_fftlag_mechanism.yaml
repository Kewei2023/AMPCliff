defaults:
  - evaluate_spectrual
  - _self_

model:
  regression:
    version: esm2_t6
    pooling: fft_latent_attn_gate
    apply: none
    spectrual_filter:
      k_bands: 8
      base: 4
      band_mode: uniform
      band_index: [0, 1, 2, 3, 4, 5, 6, 7]
      mode: notch
      preserve_norm: true
      dim: seq_len
      split_for_plot: [test]
    check_point:
      load: true
      path: ""

data:
  diff: [5]
  threshold: 0.9
  regression:
    mode: fix
    dataset: s_aureus
    condition: [blosum62 average]
    fix:
      all_train_file: "/data/home/scv6872/run/kwli/AMPCliff/data/blosum62 average/diff_{diff}-trd_{threshold}/grampa_{dataset}_7_25-all-train.csv"
      train_file: "/data/home/scv6872/run/kwli/AMPCliff/data/blosum62 average/diff_{diff}-trd_{threshold}/grampa_{dataset}_7_25-train.csv"
      valid_file: "/data/home/scv6872/run/kwli/AMPCliff/data/blosum62 average/diff_{diff}-trd_{threshold}/grampa_{dataset}_7_25-valid.csv"
      test_file: "/data/home/scv6872/run/kwli/AMPCliff/data/blosum62 average/diff_{diff}-trd_{threshold}/grampa_{dataset}_7_25-test.csv"

analysis:
  peptide_manifest: ""
  max_samples: null
  shuffle_dataloader: false

train:
  batch_size: 1

psd_gate_analysis:
  k_bands: 8
  base: 4
  band_mode: uniform
  splits: [test]

latent_analysis:
  k_bands: 8
  base: 4
  band_mode: uniform
  splits: [test]
  plot_legacy_attention_mass: false
  # Primary PNGs are written per peptide under per_sample/idx_{idx}/ (not aggregated at exp4 root).
  primary_plots:
    - query_contribution
    - latent_out_cosine
    - attn_deviation
    - weighted_readout
    - gate_input_compare
    - gate_input_band_profile

logger:
  log: false

mode:
  ddp: false
  amp: false
