orig_cwd: "."
# from debug to cluster running: change ddp => true, change logger => true
mode:
  ddp: false # false # true # false 
  amp: false # true # true # false autocast training
  nni: false

task:
  type: regression 
  
  regression: 
    default_metric: spearman # spearman


features:
  type: LLM # LLM  # CellFree-cnn # CellFree-rnn # AMPSpace # peptimizer


train:
  random_seed: 0
  num_epoch: 50 # 2 # 50
  batch_size: 4 # 2 for multi GPUs, regularly 4 for single GPU
  num_workers: 1
  learning_rate: 1e-5 # 2e-3 for DL # 1e-5 for LLM
  adam_epsilon: 1e-8
  weight_decay: 0.1 # 0.2 0.01
  loss: 'mse' # 'huber' # 'mse','huber','tmse'
  lr_scheduler:
    type: cosine # cosine, plateau
    when: batch  # batch, epoch
    cosine:
      T_0: 10
      T_mult: 2
      eta_min: 1e-6
  eval_epoch: 2
  pin_memory: False
  device_ids: [0,1,2,3,4,5,6,7]

model:
  config_dir: "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t6_8M_UR50D/" # "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t12_35M_UR50D/" # "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t6_8M_UR50D/" #"/mnt/g/likw/AMPCliff/AMPCliff/models/progen2/progen2_large/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/progen2/progen2_medium/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/progen2/progen2_base/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/progen2/progen2_small/" # "/mnt/g/likw/AMPCliff/AMPCliff/models/ProtGPT2/" # "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t33_650M_UR50D/" # "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t33_650M_UR50D/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/gpt2-xl/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t12_35M_UR50D" # "/mnt/g/likw/AMPCliff/AMPCliff/models/bert-base-uncased/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/ProtGPT2/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/bert-base-uncased/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/ProtGPT2/"# "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t12_35M_UR50D/" # esm2_t12_35M_UR50D" # "esm2_t6_8M_UR50D" # "/mnt/g/likw/AMPCliff/AMPCliff/models/llama/llama-13b/" # "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t48_15B_UR50D/" # "" # "/mnt/g/likw/AMPCliff/AMPCliff/models/facebook/esm2_t36_3B_UR50D/" # "roberta-base", "facebook/bart-base","facebook/esm2_t33_650M_UR50D", "facebook/esm1b_t33_650M_UR50S","bert-base-uncased", "xlnet-base-cased", "gpt2"
  tokenizer: "/mnt/g/likw/AMPCliff/AMPCliff/progen2/tokenizer.json"
  regression:
    version: esm2_t6 # gpt2-base # progen2-medium # progen2-base # esm2_t12 # progen2-small # gpt2-large # gpt2-base # esm2_t33 # gpt2-large # bert-base # protgpt2 # CellFree-cnn # CellFree-rnn # AMPSpace # v1 # AMPSpace, CellFree-cnn, SeqUNet
    # attn_pooling: true
    # Supported pooling / sequence readout operators.
    # - fixed token readout: mean / max / last
    # - learnable token readout: attn / latent_attn
    # - distributional readout: swe_ot
    # - multi-layer readout: mltp (requires model.regression.apply=none)
    # - spectral local motif readout: mlsap (alias of local_spectral_anchor)
    # - multi-scale anchor-free STFT: local_stft_v2 (see local_stft_v2_* below)
    pooling: mean # max attn spectral_anchor last latent_attn swe_ot mltp local_spectral_anchor local_stft local_stft_v2 stft_latent_attn_max se_pooling
    # Pooling hyper-params: shared block + per-method overrides (Hydra: model.regression.pooling_common.* / model.regression.pooling_config.<pooling>.*)
    pooling_common:
      num_anchor: 8
      use_fft: true          # spectral readouts; override per pooling in pooling_config or CLI
      num_heads: 4
      gated: true
      dropout: 0.0
      num_latents: 8
      analysis_dim: 8
      stft_n_fft: 8
      stft_win_length: null   # null => use stft_n_fft
      stft_hop_length: null   # null => max(1, win_length//2)
      stft_center: false      # false: simpler frame-to-token alignment for short AMP sequences
      use_phase: false        # true: concat real/imag in frame descriptors (larger anchors)
      scorer_hidden_dim: null # null => auto max(16, frame_desc_dim//2), used by local_stft / local_stft_v2
    pooling_config:
      mean: {}
      max: {}
      last: {}
      attn: {}
      mltp: {}
      spectral_anchor:
        use_fft: true
      spectral_anchor_v2:
        use_fft: true
        aggregation: soft  # soft, max, mean
        use_projection: true
      multi_head_spectral:
        use_fft: true
      local_spectral_anchor:
        frame_weight_version: old # old: attn.mean(dim=-1); use local_spectral_anchor_new for new behavior
      local_spectral_anchor_new: {}
      mlsap:
        frame_weight_version: old
      local_stft:
        scorer_type: mlp      # linear | mlp
      local_stft_v2:
        n_ffts: [4, 8]
        win_lengths: [4, 8]   # null => align to n_ffts per scale inside the module
        hop_lengths: [2, 4]   # null => win_length//2 per scale
        frame_temperature: 0.5
        output_proj: true
        residual_mix_init: 0.1
      stft_latent_attn_max:
        attn_num_heads: 4     # descriptor-space MHA heads (not num_heads in pooling_common for local_stft)
        use_complex_residual: true
        return_time_gate: false  # true: ISTFT branch; false: frame-score -> token weights
        token_gate_mode: scalar  # scalar | vector
        eps: 1.0e-6
      fft_latent_attn_gate:
        num_heads: 4
        num_latents: 8
        time_pool: max        # max | mean
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_latent_attn_gate_v1_2:
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      # Ablation variants of FFT-LAG
      fft_latent_only:         # FFT-LATENT: keep FFT + latent, no gate
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: false
        use_latent: true
      fft_gate_only:           # FFT-GATE: keep FFT + gate, no latent queries
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: false
      fft_gate_only_no_residual:   # FFT-GATE without gate residual
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: false
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: false
      fft_gate_only_tp_mean:       # FFT-GATE with time_pool=mean
        num_heads: 4
        num_latents: 8
        time_pool: mean
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: false
      fft_gate_only_tp_attn:       # FFT-GATE with time_pool=attn
        num_heads: 4
        num_latents: 8
        time_pool: attn
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: false
      fft_lag_no_residual:     # FFT-LAG without (1+g) residual
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: false
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_lag_tp_mean:         # FFT-LAG with time_pool=mean
        num_heads: 4
        num_latents: 8
        time_pool: mean
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_lag_tp_max:          # FFT-LAG with time_pool=max (same as default, explicit)
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_lag_tp_attn:         # FFT-LAG with time_pool=attn
        num_heads: 4
        num_latents: 8
        time_pool: attn
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_lag_L1:              # FFT-LAG with num_latents=1
        num_heads: 4
        num_latents: 1
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_lag_L4:              # FFT-LAG with num_latents=4
        num_heads: 4
        num_latents: 4
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_lag_L8:              # FFT-LAG with num_latents=8 (same as default, explicit)
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_lag_L16:             # FFT-LAG with num_latents=16
        num_heads: 4
        num_latents: 16
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
        use_gate: true
        use_latent: true
      fft_latent_attn_gate_v2:
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
      fft_latent_attn_gate_v3:
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
      fft_latent_attn_gate_v3_1:
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
      fft_latent_attn_gate_v3_2:
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
      fft_latent_attn_gate_v3_3:
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
      fft_latent_attn_max:
        num_heads: 4
        num_latents: 8
        time_pool: max
        gate_residual: true
        eps: 1.0e-6
        dropout: 0.0
      frequency_aware:
        num_freq_components: 16
      se_pooling: {}
      latent_attn: {}
      swe_ot:
        num_projections: 32
        num_quantiles: 8
    apply: filter_dc # distill_vc # scale_dc none filter_dc




    seperate_dc:
      dim: seq_len # hidden_dim
      mode: dct # dct fft
    spectrual_filter:
      rotary_knock: [5]
    inter_layer:
      save_type: real
      n_rotations: 8
      pool: max
    intra_layer:
      return_time : false
      save_type: real
      out_dim_per_layer: 53 # 53
      fft: true
    harmonic:
      num_freq: 4
      include_dc: true
      freq_scale: log
      # Numeric cap for log/linear frequency grid end, or string auto -> max(L/2,1) from layer count L
      max_freq: 8.0
      normalize_basis: true
      coord_norm: unit
    check_point: 
      load: false # false
      pretrain_only: false
      path: "/mnt/g/likw/AMPCliff/AMPCliff/outputs/2025-11-01/10-01-22/esm2_t6/blosum62 average/diff5-trd0.9/model_step_25_spearman_0.756"
      # distill vc 2.5 max
