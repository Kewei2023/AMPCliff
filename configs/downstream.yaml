# Input perturbation robustness + representation consistency (downstream_evaluate_perturbation.py)
perturbation:
  ratios: [0.1, 0.2, 0.3]
  seed: 42
  num_repeats: 1
  split: test                 # train | valid | test
  save_plots: true
  skip_checkpoint: false      # true: skip loading weights (smoke test only)
  output_dir: ""              # override via CLI: perturbation.output_dir=/path/to/seed_dir

data:
  max_length: 28 # 28
  diff: [5] # [2,3,4,5]
  threshold: 0.9
  regression:
    mode: 'fix' # 'random'# 'fix' #'fix'    
    noise_level: 0 # 10 level in total
    condition: ['blosum62 average'] # ['blosum62 average','tanimoto average']
    acindex: false
    dataset: "s_aureus" # "e_coli" or "s_aureus"
    fix:
      all_train_file: "/mnt/g/likw/AMPCliff/AMPCliff/data/blast/{condition}/diff_{diff}/grampa_{dataset}_7_25-all-train.csv"
      train_file: "/mnt/g/likw/AMPCliff/AMPCliff/data/blast/{condition}/diff_{diff}/grampa_{dataset}_7_25-train.csv"
      valid_file: "/mnt/g/likw/AMPCliff/AMPCliff/data/blast/{condition}/diff_{diff}/grampa_{dataset}_7_25-valid.csv"
      test_file: "/mnt/g/likw/AMPCliff/AMPCliff/data/blast/{condition}/diff_{diff}/grampa_{dataset}_7_25-test.csv"     
    random:
      data_file: "/mnt/g/likw/AMPCliff/AMPCliff/data/grampa_e_coli_7_25.csv" 
      fold: 5
      stratified: True
      fold_files: "/mnt/g/likw/AMPCliff/AMPCliff/data/folds_e_coli"
      checkpoints: []  
logger:
  log: false
  log_dir: "outputs"
  log_per_steps: 10
  final_artifact_path: final

other:
  debug: true # false # false # False
  debug_samples: 5
  debug_step: 5

# =============================================================================
# Novelty / OOD Generalization Evaluation (downstream_evaluate_novelty.py)
# =============================================================================
novelty:
  metrics: ["seq_identity", "edit_distance", "embedding_cosine"]
  n_buckets: 3
  bucket_labels: ["near", "medium", "far"]
  embedding_batch_size: 32
  save_plots: true
  output_dir: ""              # override via CLI: novelty.output_dir=/path/to/output

# =============================================================================
# Hydra Configuration for Dynamic Output Directory
# =============================================================================
hydra:
  run:
    # Directory format: outputs/YYYY-MM-DD/HH-MM-SS_dataset_model_apply_pooling
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${data.regression.dataset}_${model.regression.version}_${model.regression.apply}_${model.regression.pooling}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${data.regression.dataset}_${model.regression.version}_${model.regression.apply}_${model.regression.pooling}
