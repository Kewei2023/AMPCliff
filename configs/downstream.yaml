orig_cwd: "."
# from debug to cluster running: change ddp => true, change logger => true
mode:
  ddp: false # true # false 
  nni: false
  accelerate: false # true # false
  # full: false # training full dataset
  # data: random # random, test_not_in_train, test_in_train
  # debiase: false
  # deepspeed:
  #   config: /data/home/scv6872/Breeze/configs/ds_config.json

# defaults:
#   - regressor: v1
 
task:
  type: regression # regression # rank # regression # regression # regression # pretrain # binary # affinity, multitask, contact_map
  binary: 
    default_metric: accuracy
  # pretrain:  
  #   default_metric: accuracy # loss
  regression: 
    default_metric: spearman # spearman
  rank:
    default_metric: spearman

features:
  type: CellTree-cnn # gpt2-large # bert-base # protgpt2 # breeze # CellTree-cnn # breeze # CellTree-rnn # amino_acid # AMPSpace, HC, CellTree-rnn, CellTree-cnn


train:
  random_seed: 0
  num_epoch: 50 # 2 # 50
  batch_size: 4 # 4 # 512 # 512 # 1024 # 8
  num_workers: 1
  freeze: [] # [3,4,7,8]
  learning_rate: 1e-4
  adam_epsilon: 1e-8
  weight_decay: 0.2
  loss: 'mse' # 'huber' # 'mse','huber','tmse'
  loss_type: '12+1+2' # 12, 1+2 
  loss_beta: 0.6989700043360189 # log10(5)
  lr_scheduler:
    type: cosine # cosine, plateau
    when: batch  # batch, epoch
    cosine:
      T_0: 10
      T_mult: 2
      eta_min: 1e-6
  eval_epoch: 2
  pin_memory: False
  device_ids: [0,1,2,3]

