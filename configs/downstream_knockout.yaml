data:
  max_length: 28 # 28
  diff: [5] # [2,3,4,5]
  threshold: 0.9
  regression:
    mode: 'fix' # 'random'# 'fix' #'fix'    
    noise_level: 0 # 10 level in total
    condition: ['blosum62 average'] # ['blosum62 average','tanimoto average']
    acindex: false
    dataset: "e_coli"
    fix:
      all_train_file: "./data/blosum62 average/diff_{diff}-trd_{threshold}/grampa_{dataset}_7_25-all-train.csv"
      train_file: "./data/blosum62 average/diff_{diff}-trd_{threshold}/grampa_{dataset}_7_25-train.csv"
      valid_file: "./data/blosum62 average/diff_{diff}-trd_{threshold}/grampa_{dataset}_7_25-valid.csv"
      test_file: "./data/blosum62 average/diff_{diff}-trd_{threshold}/grampa_{dataset}_7_25-test.csv"     
    random:
      data_file: "/mnt/g/likw/AMPCliff/AMPCliff/data/grampa_e_coli_7_25.csv" 
      fold: 5
      stratified: True
      fold_files: "/mnt/g/likw/AMPCliff/AMPCliff/data/folds_e_coli"
      checkpoints: []  
logger:
  log: false
  log_dir: "outputs"
  log_per_steps: 10
  final_artifact_path: final

other:
  debug: false
  debug_samples: 2
  debug_step: 5
